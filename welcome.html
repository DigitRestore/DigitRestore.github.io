<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DigitRestore assure le diagnostic et la réparation soignée de smartphones, avec un suivi transparent du début à la fin.">
<title>DigitRestore - Réparation de smartphones</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bleu-nuit:#041426;
    --bleu-encre:#071d38;
    --bleu:#18aaf4;
    --violet:#4b2b79;
    --rouge:#ff554b;
    --ivoire:#fff6e8;
    --texte-secondaire:rgba(242,239,235,.78);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    color-scheme:dark;
    background:var(--bleu-nuit);
}

body{
    min-width:320px;
    min-height:100vh;
    min-height:100svh;
    overflow-x:hidden;
    color:var(--ivoire);
    font-family:"Manrope",Arial,sans-serif;
    background:
        radial-gradient(ellipse at 99% 103%,rgba(222,47,76,.82) 0%,rgba(155,35,82,.34) 23%,transparent 48%),
        radial-gradient(ellipse at 83% 5%,rgba(80,44,137,.72) 0%,rgba(42,35,105,.35) 30%,transparent 58%),
        linear-gradient(112deg,#031426 0%,#061a35 43%,#111943 70%,#251633 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 12% 70%,rgba(19,119,190,.10),transparent 30%),
        linear-gradient(120deg,rgba(255,255,255,.012),transparent 38% 72%,rgba(255,255,255,.018));
}

a{
    color:inherit;
}

.skip-link{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    padding:10px 14px;
    color:#06101d;
    background:#fff;
    border-radius:6px;
    transform:translateY(-170%);
    transition:transform .2s ease;
}

.skip-link:focus{
    transform:translateY(0);
}

.page{
    position:relative;
    z-index:1;
    isolation:isolate;
    width:min(1920px,100%);
    min-height:100vh;
    min-height:100svh;
    margin:0 auto;
    overflow:hidden;
}

.site-header{
    position:relative;
    z-index:5;
    height:clamp(118px,14vh,152px);
    display:flex;
    align-items:center;
    padding:clamp(24px,3.4vw,54px) clamp(28px,4.4vw,84px) 0;
}

.brand{
    display:inline-flex;
    align-items:center;
    gap:clamp(14px,1.4vw,25px);
    text-decoration:none;
}

.brand-logo{
    width:clamp(70px,5vw,94px);
    height:clamp(70px,5vw,94px);
    flex:0 0 auto;
    object-fit:contain;
    filter:drop-shadow(0 0 11px rgba(25,168,244,.31)) drop-shadow(0 12px 24px rgba(0,0,0,.32));
}

.brand-name{
    display:flex;
    gap:0;
    font-size:clamp(31px,2.15vw,42px);
    font-weight:600;
    line-height:1;
    letter-spacing:.005em;
}

.brand-digit{
    color:var(--bleu);
}

.brand-restore{
    color:var(--rouge);
}

.hero{
    position:relative;
    min-height:calc(100vh - clamp(118px,14vh,152px));
    min-height:calc(100svh - clamp(118px,14vh,152px));
    display:grid;
    grid-template-columns:minmax(410px,37%) 1fr;
    align-items:center;
    padding:clamp(18px,2vh,34px) clamp(28px,4.4vw,84px) clamp(54px,6vh,82px);
}

.hero-copy{
    position:relative;
    z-index:3;
    max-width:620px;
    animation:arrivee-texte .72s cubic-bezier(.22,.78,.32,1) both;
}

.hero-kicker{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:17px;
    margin-bottom:clamp(35px,4.8vh,55px);
    color:rgba(255,249,239,.93);
    font-size:clamp(15px,1.08vw,20px);
    font-weight:600;
    line-height:1.4;
    letter-spacing:.14em;
    text-transform:uppercase;
}

.hero-kicker::after{
    content:"";
    width:138px;
    height:2px;
    background:linear-gradient(90deg,var(--bleu) 0 49%,var(--rouge) 51% 100%);
    box-shadow:0 0 16px rgba(24,170,244,.18),0 0 18px rgba(255,85,75,.14);
}

.hero-title{
    max-width:620px;
    color:var(--ivoire);
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:clamp(60px,5vw,88px);
    font-weight:500;
    line-height:.96;
    letter-spacing:-.035em;
    text-wrap:balance;
}

.hero-title span,
.hero-title em{
    display:block;
}

.hero-title em{
    margin-top:.08em;
    color:var(--rouge);
    font-weight:500;
    line-height:.92;
}

.hero-separator{
    width:62px;
    height:1px;
    margin:clamp(28px,4vh,43px) 0 clamp(23px,3vh,32px);
    border:0;
    background:rgba(255,246,232,.24);
}

.hero-text{
    max-width:590px;
    color:var(--texte-secondaire);
    font-size:clamp(18px,1.24vw,22px);
    font-weight:400;
    line-height:1.65;
}

.hero-text-line{
    display:block;
}

.main-cta{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:space-between;
    gap:34px;
    min-width:min(360px,100%);
    margin-top:clamp(28px,4vh,42px);
    padding:18px 28px;
    border:1px solid transparent;
    border-radius:3px;
    color:#fff8ec;
    background:
        linear-gradient(rgba(4,20,38,.88),rgba(4,20,38,.88)) padding-box,
        linear-gradient(105deg,var(--bleu),var(--violet),var(--rouge),var(--bleu)) border-box;
    background-size:100% 100%,300% 100%;
    box-shadow:0 16px 42px rgba(0,0,0,.24),inset 0 0 28px rgba(32,63,111,.10);
    overflow:hidden;
    text-decoration:none;
    font-size:clamp(16px,1.06vw,19px);
    font-weight:500;
    animation:bordure-vivante 7s linear infinite;
    transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease;
}

.main-cta::before{
    content:"";
    position:absolute;
    inset:-120% -40%;
    background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.16) 49%,transparent 60%);
    transform:translateX(-62%);
    animation:reflet-bouton 5.6s ease-in-out infinite;
    pointer-events:none;
}

.main-cta:hover{
    transform:translateY(-3px);
    box-shadow:0 21px 48px rgba(0,0,0,.34),0 0 27px rgba(84,62,151,.18);
}

.main-cta:focus-visible{
    outline:3px solid rgba(24,170,244,.55);
    outline-offset:5px;
}

.main-cta-arrow{
    position:relative;
    z-index:1;
    color:var(--rouge);
    font-size:27px;
    font-weight:400;
    line-height:1;
    transition:transform .25s ease;
}

.main-cta-label{
    position:relative;
    z-index:1;
}

.main-cta:hover .main-cta-arrow{
    transform:translateX(6px);
}

.atelier-visual{
    position:absolute;
    z-index:0;
    top:clamp(-154px,-14vh,-112px);
    right:clamp(-150px,-6vw,-72px);
    bottom:clamp(-100px,-7vh,-60px);
    left:24%;
    margin:0;
    pointer-events:none;
    animation:arrivee-atelier 1s cubic-bezier(.22,.78,.32,1) .08s both;
}

.atelier-image{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:52% center;
    filter:saturate(.94) contrast(1.04) brightness(.88);
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 7%,rgba(0,0,0,.28) 15%,rgba(0,0,0,.72) 26%,#000 40%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 7%,rgba(0,0,0,.28) 15%,rgba(0,0,0,.72) 26%,#000 40%,#000 100%);
}

.atelier-visual::before,
.atelier-visual::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 7%,rgba(0,0,0,.28) 15%,rgba(0,0,0,.72) 26%,#000 40%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.05) 7%,rgba(0,0,0,.28) 15%,rgba(0,0,0,.72) 26%,#000 40%,#000 100%);
}

.atelier-visual::before{
    background:linear-gradient(180deg,rgba(23,17,75,.76) 0%,rgba(22,20,69,.22) 18%,transparent 31%,transparent 70%,rgba(60,18,66,.28) 82%,rgba(71,18,58,.72) 100%);
}

.atelier-visual::after{
    background:
        radial-gradient(ellipse at 100% 105%,rgba(255,59,77,.36) 0%,rgba(151,36,92,.20) 31%,transparent 59%),
        radial-gradient(ellipse at 82% -4%,rgba(90,55,160,.30),transparent 52%);
    mix-blend-mode:screen;
}

.visually-hidden{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}

@keyframes arrivee-texte{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes arrivee-atelier{
    from{opacity:0;transform:scale(1.018)}
    to{opacity:1;transform:scale(1)}
}

@keyframes bordure-vivante{
    from{background-position:0 0,0% 50%}
    to{background-position:0 0,300% 50%}
}

@keyframes reflet-bouton{
    0%,58%{transform:translateX(-62%)}
    78%,100%{transform:translateX(62%)}
}

@media(max-width:1100px){
    .page{
        min-height:100svh;
        overflow:hidden;
    }

    .site-header{
        height:auto;
        padding:28px 34px 0;
    }

    .hero{
        min-height:auto;
        display:flex;
        flex-direction:column;
        align-items:stretch;
        padding:70px 34px 0;
    }

    .hero-copy{
        max-width:680px;
    }

    .hero-title{
        max-width:680px;
        font-size:clamp(62px,9vw,86px);
    }

    .atelier-visual{
        position:relative;
        inset:auto;
        width:calc(100% + 68px);
        height:clamp(430px,64vw,690px);
        margin:-36px -34px -24px;
    }

    .atelier-image{
        object-position:56% center;
        -webkit-mask-image:radial-gradient(ellipse 79% 69% at 58% 48%,#000 0%,#000 52%,rgba(0,0,0,.90) 67%,rgba(0,0,0,.38) 84%,transparent 100%);
        mask-image:radial-gradient(ellipse 79% 69% at 58% 48%,#000 0%,#000 52%,rgba(0,0,0,.90) 67%,rgba(0,0,0,.38) 84%,transparent 100%);
    }

    .atelier-visual::before{
        background:
            linear-gradient(180deg,var(--bleu-nuit) 0%,rgba(4,20,38,.65) 10%,transparent 30%,transparent 74%,rgba(49,18,59,.64) 100%),
            linear-gradient(90deg,rgba(4,20,38,.72),transparent 18% 82%,rgba(33,19,53,.42));
    }
}

@media(max-width:650px){
    .site-header{
        padding:21px 20px 0;
    }

    .brand{
        gap:12px;
    }

    .brand-logo{
        width:60px;
        height:60px;
    }

    .brand-name{
        gap:0;
        font-size:27px;
    }

    .hero{
        padding:58px 20px 0;
    }

    .hero-kicker{
        gap:14px;
        margin-bottom:34px;
        font-size:14px;
        letter-spacing:.12em;
    }

    .hero-kicker::after{
        width:110px;
    }

    .hero-title{
        font-size:clamp(48px,14vw,64px);
        line-height:.96;
    }

    .hero-separator{
        margin:28px 0 22px;
    }

    .hero-text{
        font-size:17px;
        line-height:1.65;
    }

    .main-cta{
        width:100%;
        min-width:0;
        margin-top:28px;
        padding:17px 21px;
    }

    .atelier-visual{
        width:calc(100% + 40px);
        height:370px;
        margin:-6px -20px -18px;
    }

    .atelier-image{
        object-position:57% center;
        -webkit-mask-image:radial-gradient(ellipse 91% 68% at 57% 48%,#000 0%,#000 49%,rgba(0,0,0,.88) 64%,rgba(0,0,0,.34) 83%,transparent 100%);
        mask-image:radial-gradient(ellipse 91% 68% at 57% 48%,#000 0%,#000 49%,rgba(0,0,0,.88) 64%,rgba(0,0,0,.34) 83%,transparent 100%);
    }
}

@media(max-height:780px) and (min-width:1101px){
    .site-header{
        height:112px;
        padding-top:20px;
    }

    .brand-logo{
        width:72px;
        height:72px;
    }

    .hero{
        min-height:calc(100svh - 112px);
        padding-top:8px;
        padding-bottom:34px;
    }

    .hero-kicker{
        margin-bottom:28px;
    }

    .hero-title{
        font-size:clamp(58px,4.7vw,76px);
    }

    .hero-separator{
        margin:26px 0 21px;
    }

    .main-cta{
        margin-top:25px;
    }

    .atelier-visual{
        top:-112px;
        bottom:-48px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>

<div class="page">
    <header class="site-header">
        <a class="brand" href="welcome.html" aria-label="Accueil DigitRestore">
            <img class="brand-logo" src="logo.png" alt="">
            <span class="brand-name" aria-label="DigitRestore">
                <span class="brand-digit">DIGIT</span><span class="brand-restore">RESTORE</span>
            </span>
        </a>
    </header>

    <main class="hero" id="contenu">
        <section class="hero-copy" aria-labelledby="titre-principal">
            <p class="hero-kicker">Réparation de smartphones</p>

            <h1 class="hero-title" id="titre-principal">
                <span>La technologie</span>
                <span>mérite une</span>
                <em>seconde vie.</em>
            </h1>

            <hr class="hero-separator" aria-hidden="true">

            <p class="hero-text">
                <span class="hero-text-line">Diagnostic clair, pièces adaptées</span>
                <span class="hero-text-line">et réparation soignée, avec un suivi</span>
                <span class="hero-text-line">transparent du début à la fin.</span>
            </p>

            <a class="main-cta" href="site.html">
                <span class="main-cta-label">Découvrir DigitRestore</span>
                <span class="main-cta-arrow" aria-hidden="true">→</span>
            </a>
        </section>

        <figure class="atelier-visual">
            <img
                class="atelier-image"
                src="images/site/Atelier.png"
                alt="Atelier DigitRestore équipé pour la réparation de smartphones"
                width="1672"
                height="941"
                decoding="async"
                fetchpriority="high"
            >
            <figcaption class="visually-hidden">
                Poste de travail DigitRestore avec microscope, tapis de réparation et équipements techniques.
            </figcaption>
        </figure>
    </main>
</div>
</body>
</html>
