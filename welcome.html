<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DigitRestore assure le diagnostic et la réparation soignée de smartphones et tablettes.">
<title>DigitRestore - Réparation de smartphones et tablettes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --fond:#030814;
    --fond-secondaire:#071120;
    --texte:#f7f9fc;
    --texte-secondaire:#c2cada;
    --cyan:#42ccef;
    --rouge:#ff3f55;
    --bordure:rgba(255,255,255,.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    color-scheme:dark;
}

body{
    min-width:320px;
    min-height:100vh;
    min-height:100svh;
    overflow-x:hidden;
    font-family:"Poppins",sans-serif;
    color:var(--texte);
    background:
        radial-gradient(circle at 8% 34%,rgba(35,133,181,.13),transparent 31%),
        radial-gradient(circle at 91% 76%,rgba(190,40,67,.10),transparent 29%),
        linear-gradient(135deg,var(--fond) 0%,var(--fond-secondaire) 56%,#030712 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.018),transparent 34% 72%,rgba(255,255,255,.012));
}

a{
    color:inherit;
}

.skip-link{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    padding:10px 14px;
    color:#06101d;
    background:#fff;
    border-radius:8px;
    transform:translateY(-160%);
    transition:transform .2s ease;
}

.skip-link:focus{
    transform:translateY(0);
}

.page{
    position:relative;
    z-index:1;
    width:min(1720px,100%);
    min-height:100vh;
    min-height:100svh;
    margin:0 auto;
    padding:clamp(18px,2.1vw,38px) clamp(20px,3.4vw,68px) clamp(28px,3.2vw,58px);
    display:grid;
    grid-template-rows:auto minmax(0,1fr);
}

.site-header{
    min-height:86px;
    display:flex;
    align-items:center;
    padding-bottom:18px;
    border-bottom:1px solid var(--bordure);
}

.brand{
    display:inline-flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
}

.brand-logo{
    width:64px;
    height:64px;
    flex:0 0 auto;
    object-fit:contain;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.32));
}

.brand-copy{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.brand-name{
    display:flex;
    gap:7px;
    font-family:"Montserrat",sans-serif;
    font-size:clamp(22px,2vw,31px);
    font-weight:900;
    line-height:1;
    letter-spacing:.055em;
}

.brand-name span:last-child{
    color:var(--rouge);
}

.brand-tag{
    color:var(--cyan);
    font-size:clamp(8px,.78vw,11px);
    font-weight:600;
    line-height:1.3;
    letter-spacing:.22em;
    text-transform:uppercase;
}

.hero{
    min-height:0;
    display:grid;
    grid-template-columns:minmax(400px,.82fr) minmax(560px,1.28fr);
    align-items:center;
    gap:clamp(42px,5vw,88px);
    padding:clamp(44px,7vh,92px) 0 clamp(16px,3vh,38px);
}

.hero-copy{
    max-width:650px;
    animation:arrivee-texte .65s ease-out both;
}

.hero-kicker{
    width:170px;
    height:4px;
    margin-bottom:30px;
    border-radius:99px;
    background:linear-gradient(90deg,var(--cyan),var(--rouge));
}

.hero-title{
    max-width:650px;
    font-family:"Poppins",sans-serif;
    font-size:clamp(42px,4.2vw,69px);
    font-weight:700;
    line-height:1.08;
    letter-spacing:-.045em;
    text-wrap:balance;
}

.hero-subtitle{
    margin-top:24px;
    color:var(--cyan);
    font-size:clamp(19px,1.65vw,27px);
    font-weight:600;
    line-height:1.35;
}

.hero-text{
    max-width:610px;
    margin-top:20px;
    color:var(--texte-secondaire);
    font-size:clamp(14px,1.05vw,17px);
    line-height:1.75;
}

.main-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:24px;
    min-width:300px;
    margin-top:32px;
    padding:17px 25px;
    border:1px solid transparent;
    border-radius:15px;
    color:var(--texte);
    background:
        linear-gradient(#07101f,#07101f) padding-box,
        linear-gradient(105deg,var(--cyan),var(--rouge)) border-box;
    box-shadow:0 15px 38px rgba(0,0,0,.26);
    text-decoration:none;
    font-size:15px;
    font-weight:700;
    transition:transform .22s ease,background-color .22s ease,box-shadow .22s ease;
}

.main-cta:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 44px rgba(0,0,0,.34);
}

.main-cta:focus-visible{
    outline:3px solid rgba(66,204,239,.48);
    outline-offset:5px;
}

.main-cta-arrow{
    font-size:23px;
    font-weight:400;
    line-height:1;
    transition:transform .22s ease;
}

.main-cta:hover .main-cta-arrow{
    transform:translateX(4px);
}

.atelier-card{
    position:relative;
    isolation:isolate;
    width:100%;
    padding:1px;
    border-radius:30px;
    background:linear-gradient(120deg,rgba(66,204,239,.92),rgba(255,255,255,.13) 47%,rgba(255,63,85,.90));
    box-shadow:0 30px 80px rgba(0,0,0,.46);
    animation:arrivee-image .75s ease-out .12s both;
}

.atelier-card::before{
    content:"";
    position:absolute;
    z-index:-1;
    inset:10% 4% -8%;
    border-radius:36px;
    background:linear-gradient(90deg,rgba(66,204,239,.13),rgba(255,63,85,.12));
    filter:blur(36px);
}

.atelier-image{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    border-radius:29px;
    object-fit:cover;
    object-position:center;
    background:#080d16;
}

.visually-hidden{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}

@keyframes arrivee-texte{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
}

@keyframes arrivee-image{
    from{opacity:0;transform:translateY(18px) scale(.99)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

@media(max-width:1180px){
    .page{
        min-height:auto;
    }

    .hero{
        grid-template-columns:1fr;
        gap:46px;
        padding-top:54px;
    }

    .hero-copy{
        max-width:760px;
    }

    .hero-title{
        max-width:760px;
        font-size:clamp(42px,7vw,66px);
    }

    .atelier-card{
        max-width:980px;
    }
}

@media(max-width:720px){
    .page{
        padding:15px 18px 32px;
    }

    .site-header{
        min-height:70px;
        padding-bottom:13px;
    }

    .brand{
        gap:10px;
    }

    .brand-logo{
        width:48px;
        height:48px;
    }

    .brand-name{
        font-size:20px;
    }

    .brand-tag{
        max-width:250px;
        font-size:7px;
        letter-spacing:.16em;
    }

    .hero{
        gap:34px;
        padding-top:42px;
    }

    .hero-kicker{
        width:120px;
        margin-bottom:22px;
    }

    .hero-title{
        font-size:clamp(36px,11vw,50px);
        line-height:1.1;
    }

    .hero-subtitle{
        margin-top:20px;
    }

    .hero-text{
        margin-top:16px;
        line-height:1.65;
    }

    .main-cta{
        width:100%;
        min-width:0;
        margin-top:26px;
    }

    .atelier-card,
    .atelier-image{
        border-radius:20px;
    }

    .atelier-card{
        padding:1px;
    }

    .atelier-image{
        border-radius:19px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
        scroll-behavior:auto !important;
    }
}
</style>
</head>

<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>

<div class="page">
    <header class="site-header">
        <a class="brand" href="welcome.html" aria-label="Accueil DigitRestore">
            <img class="brand-logo" src="logo.png" alt="">

            <span class="brand-copy">
                <span class="brand-name">
                    <span>DIGIT</span><span>RESTORE</span>
                </span>
                <span class="brand-tag">Réparation de smartphones &amp; tablettes</span>
            </span>
        </a>
    </header>

    <main class="hero" id="contenu">
        <section class="hero-copy" aria-labelledby="titre-principal">
            <div class="hero-kicker" aria-hidden="true"></div>

            <h1 class="hero-title" id="titre-principal">
                Réparation de smartphones &amp; tablettes
            </h1>

            <p class="hero-subtitle">La technologie mérite une seconde vie.</p>

            <p class="hero-text">
                Diagnostic clair, pièces adaptées et réparation soignée,
                avec un suivi transparent du début à la fin.
            </p>

            <a class="main-cta" href="site.html">
                <span>Découvrir DigitRestore</span>
                <span class="main-cta-arrow" aria-hidden="true">→</span>
            </a>
        </section>

        <figure class="atelier-card">
            <img
                class="atelier-image"
                src="images/site/Atelier.png"
                alt="Atelier DigitRestore équipé pour la réparation de smartphones et tablettes"
                width="1672"
                height="941"
                decoding="async"
                fetchpriority="high"
            >
            <figcaption class="visually-hidden">
                Poste de travail DigitRestore avec microscope, tapis de réparation et équipements techniques.
            </figcaption>
        </figure>
    </main>
</div>
</body>
</html>
